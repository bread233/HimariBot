name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths-ignore:
      - 'README.md'
      - 'README*.md'
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docker/*.yml'
      - 'docker-compose*.yml'

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install "poetry>=1.8,<2.0"
          poetry install --only main --no-interaction --no-ansi
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          poetry run pyinstaller --onefile --name HimariBot --hidden-import nonebot.drivers.fastapi --hidden-import nonebot.drivers.httpx --hidden-import nonebot.drivers.aiohttp --hidden-import nonebot.adapters.onebot.v11 --hidden-import nonebot.adapters.qq bot.py
          dir dist

      - name: Prepare package
        shell: cmd
        run: |
          mkdir package
          copy dist\HimariBot.exe package\
          if exist .env.prod.example copy .env.prod.example package\.env.prod
          mkdir package\data
          if exist resources\data xcopy resources\data package\data /E /I /Y
          powershell -command "Compress-Archive -Path package\* -DestinationPath HimariBot-${{ github.ref_name }}-windows.zip"
          dir

      - name: Create GitHub Release & Upload asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            HimariBot-${{ github.ref_name }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
