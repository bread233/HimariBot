name: Build Windows EXE

on:
  workflow_dispatch:          # 手动执行
  push:
    tags:
      - "v*"                  # 打 tag 时自动构建并发 Release
    paths-ignore:             # 以下文件改动不触发
      - 'README.md'
      - 'README*.md'
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docker/*.yml'
      - 'docker-compose*.yml'

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --name HimariBot bot.py

      - name: Prepare package
        run: |
          mkdir package
          copy dist\HimariBot.exe package\
          if exist .env.dev.example copy .env.dev.example package\
          powershell -command "Compress-Archive -Path package\* -DestinationPath HimariBot-${{ github.ref_name }}-windows.zip"

      - name: Create GitHub Release & Upload asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            HimariBot-${{ github.ref_name }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
