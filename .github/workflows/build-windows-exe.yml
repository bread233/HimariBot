name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths-ignore:
      - 'README.md'
      - 'README*.md'
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docker/*.yml'
      - 'docker-compose*.yml'

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry export -f requirements.txt --output requirements.txt --only main --without-hashes
          pip install -r requirements.txt
          pip install "nonebot2[fastapi]"
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --name HimariBot bot.py
          dir dist

      - name: Prepare package
        shell: cmd
        run: |
          mkdir package
          copy dist\HimariBot.exe package\
          if exist .env.dev.example copy .env.dev.example package\
          powershell -command "Compress-Archive -Path package\* -DestinationPath HimariBot-${{ github.ref_name }}-windows.zip"
          dir

      - name: Create GitHub Release & Upload asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            HimariBot-${{ github.ref_name }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
