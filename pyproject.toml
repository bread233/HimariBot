[project]
name = "himaribot-test-a01"
version = "0.1.0"
description = "HimariBot-test-A01"
readme = "README.md"
requires-python = ">=3.8, <4.0"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
    { name = "Ntchat", module_name = "nonebot.adapters.ntchat" }
]
plugins = []
plugin_dirs = ["src/plugins"]
builtin_plugins = ["echo"]

[tool.poetry]
name = "himaribot-test-a01"
version = "0.1.0"
description = ""
authors = ["bread233 <zhangzhenyu353@gmail.com>"]
readme = "README.md"
packages = [
  { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
apscheduler = "3.10.1"
aiohttp = "^3.8.5"
lxml = ">=4.9.3"
tinydb = "4.7.0"
