<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仙途绘卷 SPA</title><style>
:root{--bg:#0f0815;--panel:#1d1329;--gold:#f5d27b;--muted:#c8aecf;--line:rgba(245,210,123,.25);--text:#fff5dd;--green:#84f4b0;--blue:#6bc9ff;--purple:#b58cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,rgba(150,80,220,.25),transparent 26%),linear-gradient(135deg,#100713,#251334 55%,#100713);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:rgba(13,7,19,.82);padding:18px;position:sticky;top:0;height:100vh}.brand{font-size:24px;color:var(--gold);font-weight:900;letter-spacing:.12em;margin-bottom:18px}.nav{display:grid;gap:8px}.nav button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);border-radius:14px;padding:11px 12px;text-align:left;cursor:pointer}.nav button.active{background:linear-gradient(180deg,#ffe7a7,#d79534);color:#281400;font-weight:900}.main{padding:18px;max-width:1280px;width:100%;margin:0 auto}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}.card{border:1px solid var(--line);background:rgba(29,19,41,.86);border-radius:18px;padding:16px;box-shadow:0 12px 34px rgba(0,0,0,.28)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.title{margin:0 0 12px;color:var(--gold)}.muted{color:var(--muted);line-height:1.7}.stat b{display:block;font-size:22px;color:var(--text);margin-top:4px}.btn{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(180deg,#ffe7a7,#bd7928);color:#2a1400;font-weight:900;cursor:pointer}.btn.ghost{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--gold)}.btn:disabled{opacity:.55;cursor:not-allowed}.list{display:grid;gap:10px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--gold);font-size:12px;margin:2px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text)}.toast{position:fixed;right:18px;bottom:18px;background:#150d1e;border:1px solid var(--line);border-radius:14px;padding:12px 14px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}.battle-stage{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:320px;border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(0,0,0,.18);overflow:hidden}.fighter{display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.05);font-size:42px;font-weight:900;color:rgba(255,255,255,.2)}.fighter.hit{animation:shake .35s}.fighter.cast{box-shadow:inset 0 0 70px rgba(245,210,123,.3)}.fighter.heal{box-shadow:inset 0 0 70px rgba(132,244,176,.35)}.fighter.aura{box-shadow:inset 0 0 70px rgba(181,140,255,.35)}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}.caption{position:absolute;left:24px;right:24px;bottom:20px;background:rgba(0,0,0,.72);border:1px solid var(--line);border-radius:14px;padding:12px}.fx{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:38px;font-weight:900;color:var(--gold);animation:pop .75s forwards;pointer-events:none}.fx.heal{color:var(--green)}.fx.miss{color:var(--blue)}.fx.buff{color:var(--purple)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-100%) scale(.9)}}.progress{height:9px;background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden;border:1px solid var(--line);flex:1}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b87928,#f5d27b)}@media(max-width:780px){.shell{grid-template-columns:1fr}.side{height:auto;position:static}.nav{grid-template-columns:repeat(2,1fr)}.battle-stage{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">仙途绘卷</div><div class="muted" id="sessionText">检查登录态...</div><hr style="border-color:var(--line);border-style:solid none none;margin:14px 0"><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><h1 class="title" id="pageTitle">洞府</h1><div><button class="btn ghost" onclick="loadAll()">刷新</button> <a class="btn ghost" href="/game" style="text-decoration:none">旧版 /game</a></div></div><section id="view"></section></main></div><div class="toast" id="toast"></div><script>
const pages=[['home','本殿'],['work','悬赏令'],['backpack','背包'],['battle','战斗剧场'],['sect','宗门'],['rift','秘境'],['alchemy','炼丹'],['shop','商城'],['rank','排行榜']];
const state={page:location.pathname.replace('/spa/','')||'home',profile:null,work:null,backpack:[],rankings:null,sect:null,rift:null,alchemy:null,shop:null,battle:null,battleIndex:0,timer:null,paused:false};
const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout($('toast')._t);$('toast')._t=setTimeout(()=>$('toast').classList.remove('show'),2600)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({success:false,error:'接口异常'}));if(!d.success)throw new Error(d.error||'请求失败');return d}
function setPage(p){state.page=p;history.pushState(null,'','/spa/'+p);renderNav();render()}window.onpopstate=()=>{state.page=location.pathname.replace('/spa/','')||'home';renderNav();render()}
function renderNav(){$('nav').innerHTML=pages.map(([k,n])=>`<button class="${state.page===k?'active':''}" onclick="setPage('${k}')">${n}</button>`).join('')}
async function checkSession(){const s=await api('/api/v1/auth/session');if(!s.logged_in){$('sessionText').innerHTML='未登录。可使用 QQ号+密码，或 QQ 一次性 Token 登录。';return false}$('sessionText').textContent='已登录：'+s.player_id;if(s.password_configured===false){if(!state._pwdTipShown){state._pwdTipShown=true;toast('建议及时设置 Web 密码，Bot 离线时仍可登录')}}return true}
async function loadAll(){try{if(!await checkSession())return renderLogin();const [p,w,b,rk,se,ri,al,sh]=await Promise.all([api('/game/api/profile'),api('/game/api/work/status'),api('/game/api/backpack'),api('/game/api/rankings'),api('/game/api/sect'),api('/game/api/rift'),api('/game/api/alchemy'),api('/game/api/shop')]);Object.assign(state,{profile:p.profile,work:w.work,backpack:b.items,rankings:rk.rankings,sect:se.sect,rift:ri.rift,alchemy:al.alchemy,shop:sh.shop});render()}catch(e){toast(e.message)}}
function renderLogin(){$('pageTitle').textContent='需要登录';$('view').innerHTML='<div class="card"><h2 class="title">未登录</h2><p class="muted">可使用 QQ号+密码直接登录；或在 QQ 私聊发送【网页登录令】获取一次性 Token。前往 /game 登录成功后即可回到 /spa。</p><a class="btn" href="/game" style="text-decoration:none">前往登录</a></div>'}
function render(){renderNav();const p=state.profile;if(!p)return renderLogin();const map={home:renderHome,work:renderWork,backpack:renderBackpack,battle:renderBattle,sect:renderSect,rift:renderRift,alchemy:renderAlchemy,shop:renderShop,rank:renderRank};(map[state.page]||renderHome)()}
function stat(k,v){return `<div class="card stat"><span class="muted">${k}</span><b>${v??'--'}</b></div>`}function itemCard(x){return `<div class="card"><h3 class="title">${x.name}</h3><span class="pill">${x.level||'凡品'}</span><span class="pill">${x.type||'未知'}</span><p class="muted">数量：${x.count??'-'} ${x.price?`｜价格：${x.price}`:''}</p><p class="muted">${x.desc||''}</p></div>`}
function renderHome(){const p=state.profile;$('pageTitle').textContent='本殿';$('view').innerHTML=`<div class="grid">${stat('道号',p.name)}${stat('境界',p.level)}${stat('灵根',p.root_type+' +'+p.root_rate+'%')}${stat('宗门',p.sect+' / '+p.sect_position)}${stat('修为',p.exp_display)}${stat('灵石',p.stone_display)}${stat('战力',p.power_display)}${stat('体力',p.stamina+'/'+p.max_stamina)}${stat('突破',p.breakthrough)}</div>`}
function renderWork(){const w=state.work;$('pageTitle').textContent='悬赏令';$('view').innerHTML=`<div class="card"><h2 class="title">${w.label}</h2><p class="muted">${w.message}</p><button class="btn" onclick="refreshWork(false)">刷新悬赏</button> <button class="btn ghost" onclick="settleWork()" ${w.status==='settle'?'':'disabled'}>结算</button> <button class="btn ghost" onclick="resetWork()">重置</button></div><div class="grid" style="margin-top:12px">${(w.tasks||[]).map(t=>`<div class="card"><h3>${t.index}. ${t.name}</h3><p class="muted">成功率 ${t.rate}%｜耗时 ${t.time} 分钟｜报酬 ${t.award_display}</p><button class="btn" onclick="acceptWork(${t.index})">接取</button></div>`).join('')||'<div class="card muted">暂无可接取悬赏</div>'}</div>`}
async function refreshWork(force){try{const d=await api('/game/api/work/refresh',{method:'POST',body:JSON.stringify({force})});if(d.need_confirm&&!force&&confirm('覆盖当前悬赏？'))return refreshWork(true);state.work=d.work;toast(d.message||'已刷新');renderWork()}catch(e){toast(e.message)}}async function acceptWork(index){try{const d=await api('/game/api/work/accept',{method:'POST',body:JSON.stringify({index})});state.work=d.work;toast(d.message||'已接取');renderWork()}catch(e){toast(e.message)}}async function settleWork(){try{const d=await api('/game/api/work/settle',{method:'POST',body:'{}'});state.work=d.work;state.profile=d.profile;toast(d.reward?.title||'已结算');renderWork()}catch(e){toast(e.message)}}async function resetWork(){try{const d=await api('/game/api/work/reset',{method:'POST',body:'{}'});state.work=d.work;toast(d.message||'已重置');renderWork()}catch(e){toast(e.message)}}
function renderBackpack(){$('pageTitle').textContent='背包';$('view').innerHTML=`<div class="grid">${state.backpack.map(itemCard).join('')||'<div class="card muted">暂无物品</div>'}</div>`}
function renderSect(){const s=state.sect;$('pageTitle').textContent='宗门';$('view').innerHTML=s.joined?`<div class="grid">${stat('宗门',s.sect_name)}${stat('职位',s.position)}${stat('宗主',s.owner)}${stat('等级',s.level)}${stat('成员',s.members)}${stat('建设度',s.materials)}${stat('规模',s.scale)}${stat('丹房',s.elixir_room_level)}</div>`:`<div class="card muted">${s.message}</div>`}
function renderRift(){const r=state.rift;$('pageTitle').textContent='秘境';$('view').innerHTML=`<div class="card"><h2 class="title">${r.in_rift?'探索中':'空闲'}</h2><p class="muted">${r.message}</p></div>`}
function renderAlchemy(){const a=state.alchemy;$('pageTitle').textContent='炼丹';$('view').innerHTML=`<div class="card muted">${a.message}</div><div class="grid" style="margin-top:12px">${(a.materials||[]).map(itemCard).join('')||'<div class="card muted">暂无炼丹材料</div>'}</div>`}
function renderShop(){const s=state.shop;$('pageTitle').textContent='商城';$('view').innerHTML=`<div class="card muted">${s.message}</div><div class="grid" style="margin-top:12px">${(s.goods||[]).map(itemCard).join('')||'<div class="card muted">暂无商品</div>'}</div>`}
function renderRank(){const r=state.rankings;$('pageTitle').textContent='排行榜';function block(name,rows){return `<div class="card"><h2 class="title">${name}</h2><div class="list">${(rows||[]).map(x=>`<div class="row"><span>#${x.rank} ${x.name}<small class="muted"> · ${x.level}</small></span><b>${x.value_display}</b></div>`).join('')}</div></div>`}$('view').innerHTML=`<div class="grid">${block('修为榜',r.exp)}${block('灵石榜',r.stone)}${block('战力榜',r.power)}</div>`}
function renderBattle(){$('pageTitle').textContent='战斗剧场';$('view').innerHTML=`<div class="card"><div class="row"><button class="btn" onclick="startScarecrow()">挑战稻草人</button><div style="display:flex;gap:8px;flex:1"><input class="input" id="target" placeholder="对手QQ / 道号"><button class="btn ghost" onclick="startPlayerBattle()">切磋</button></div></div><div class="row" style="margin:12px 0"><button class="btn ghost" id="pauseBtn" onclick="toggleBattle()" disabled>暂停</button><button class="btn ghost" id="skipBtn" onclick="skipBattle()" disabled>跳过</button><span class="pill" id="bpText">0/0</span><div class="progress"><i id="bpBar"></i></div></div><div class="battle-stage"><div class="fighter" id="fp">PLAYER</div><div class="fighter" id="fe">ENEMY</div><div class="caption" id="cap">选择一场战斗开始播放。</div></div><div class="list" id="blog" style="margin-top:12px"></div></div>`}
async function startScarecrow(){try{const d=await api('/game/api/battle/scarecrow',{method:'POST',body:'{}'});playBattle(d.battle)}catch(e){toast(e.message)}}async function startPlayerBattle(){const target=$('target')?.value.trim();if(!target)return toast('请输入对手');try{const d=await api('/game/api/battle/player',{method:'POST',body:JSON.stringify({target})});playBattle(d.battle)}catch(e){toast(e.message)}}
function playBattle(b){state.battle=b;state.battleIndex=0;state.paused=false;$('pauseBtn').disabled=false;$('skipBtn').disabled=false;$('pauseBtn').textContent='暂停';$('blog').innerHTML='';$('cap').textContent=`${b.title} 开始`;bp();next(500)}function next(ms){clearTimeout(state.timer);state.timer=setTimeout(step,ms)}function step(){if(!state.battle||state.paused)return;if(state.battleIndex>=state.battle.events.length)return finish();const ev=state.battle.events[state.battleIndex++];renderEv(ev);bp();next(ev.duration||850)}
function renderEv(ev){const fp=$('fp'),fe=$('fe');fp.className='fighter';fe.className='fighter';$('cap').textContent=`${ev.speaker}：${ev.content}`;$('blog').insertAdjacentHTML('afterbegin',`<div class="card muted">${String(ev.seq).padStart(2,'0')}｜${ev.speaker}：${ev.content}</div>`);const actor=ev.side==='player'?fp:ev.side==='enemy'?fe:null;const target=ev.target_side==='player'?fp:ev.target_side==='enemy'?fe:actor;if(actor&&ev.type==='attack')actor.classList.add('cast');if(target){target.classList.add(ev.type==='attack'?'hit':ev.type==='heal'?'heal':ev.type==='buff'?'aura':'')}if(['attack','heal','miss','buff'].includes(ev.type)){const fx=document.createElement('div');fx.className='fx '+ev.type;fx.textContent=ev.type==='miss'?'MISS':ev.type==='heal'?`+${ev.amount||''}`:ev.type==='buff'?'BUFF':`-${ev.amount||''}`;document.querySelector('.battle-stage').appendChild(fx);setTimeout(()=>fx.remove(),760)}setTimeout(()=>{fp.className='fighter';fe.className='fighter'},520)}
function bp(){const t=state.battle?.events?.length||0;$('bpText').textContent=`${state.battleIndex}/${t}`;$('bpBar').style.width=(t?state.battleIndex/t*100:0)+'%'}function finish(){clearTimeout(state.timer);$('cap').textContent='战斗结束，胜者：'+(state.battle?.winner||'--');$('pauseBtn').disabled=true;$('skipBtn').disabled=true}function toggleBattle(){state.paused=!state.paused;$('pauseBtn').textContent=state.paused?'继续':'暂停';if(!state.paused)next(160)}function skipBattle(){while(state.battle&&state.battleIndex<state.battle.events.length)renderEv(state.battle.events[state.battleIndex++]);bp();finish()}
renderNav();loadAll();
</script></body></html>
