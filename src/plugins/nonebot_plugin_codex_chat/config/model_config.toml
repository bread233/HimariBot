[inner]
version = "1.17.3"

# =========================
# Models
# =========================

[[models]]
model_identifier = "deepseek-v4-pro"
name = "deepseek-v4-pro-think"
api_provider = "DeepSeek"
price_in = 12.0
cache = false
cache_price_in = 0.0
price_out = 24.0
force_stream_mode = false
visual = false
extra_params = { thinking = { type = "enabled" }, reasoning_effort = "high" }

[[models]]
model_identifier = "deepseek-v4-pro"
name = "deepseek-v4-pro-nonthink"
api_provider = "DeepSeek"
price_in = 12.0
cache = false
cache_price_in = 0.0
price_out = 24.0
force_stream_mode = false
visual = false
extra_params = { thinking = { type = "disabled" } }

[[models]]
model_identifier = "deepseek-v4-flash"
name = "deepseek-v4-flash"
api_provider = "DeepSeek"
price_in = 1.0
cache = false
cache_price_in = 0.0
price_out = 2.0
force_stream_mode = false
visual = false
extra_params = { thinking = { type = "disabled" } }

# 本地 fallback：已验证 llama3.2:1b 返回 content 干净，无 reasoning
[[models]]
model_identifier = "llama3.2:1b"
name = "local-fallback"
api_provider = "LocalOpenAI"
price_in = 0.0
cache = false
cache_price_in = 0.0
price_out = 0.0
force_stream_mode = false
visual = true
extra_params = {}

# OpenRouter fallback：已验证 google/gemini-3.1-flash-lite 可稳定输出 ACTION 格式，无 reasoning
[[models]]
model_identifier = "google/gemini-3.1-flash-lite"
name = "openrouter-gemini-flash-lite"
api_provider = "OpenRouter"
price_in = 0.25
cache = false
cache_price_in = 0.0
price_out = 1.5
force_stream_mode = false
visual = false
extra_params = {}

# =========================
# Model Task Config
# =========================

[model_task_config.replyer]
model_list = ["openrouter-gemini-flash-lite", "local-fallback"]
max_tokens = 1024
temperature = 0.7
slow_threshold = 30.0
selection_strategy = "sequential"
hard_timeout = 90.0

[model_task_config.planner]
model_list = ["local-fallback", "openrouter-gemini-flash-lite"]
max_tokens = 1024
temperature = 0.3
slow_threshold = 12.0
selection_strategy = "sequential"
hard_timeout = 60.0

[model_task_config.timing_gate]
model_list = ["local-fallback", "openrouter-gemini-flash-lite"]
max_tokens = 256
temperature = 0.1
slow_threshold = 12.0
selection_strategy = "sequential"
hard_timeout = 45.0

[model_task_config.memory]
model_list = []
max_tokens = 8192
temperature = 0.5
slow_threshold = 30.0
selection_strategy = "random"
hard_timeout = 240.0

[model_task_config.mid_memory]
model_list = ["local-fallback", "openrouter-gemini-flash-lite"]
max_tokens = 1024
temperature = 0.3
slow_threshold = 12.0
selection_strategy = "sequential"
hard_timeout = 60.0

[model_task_config.utils]
model_list = ["local-fallback", "openrouter-gemini-flash-lite"]
max_tokens = 1024
temperature = 0.3
slow_threshold = 15.0
selection_strategy = "sequential"
hard_timeout = 60.0

[model_task_config.learner]
model_list = ["local-fallback", "openrouter-gemini-flash-lite"]
max_tokens = 1024
temperature = 0.3
slow_threshold = 15.0
selection_strategy = "sequential"
hard_timeout = 60.0

[model_task_config.emoji]
model_list = ["local-fallback", "openrouter-gemini-flash-lite"]
max_tokens = 512
temperature = 0.3
slow_threshold = 15.0
selection_strategy = "sequential"
hard_timeout = 60.0

[model_task_config.vlm]
model_list = ["openrouter-gemini-flash-lite"]
max_tokens = 1024
temperature = 0.2
slow_threshold = 20.0
selection_strategy = "sequential"
hard_timeout = 90.0

[model_task_config.voice]
model_list = []
max_tokens = 4096
temperature = 0.3
slow_threshold = 15.0
selection_strategy = "balance"
hard_timeout = 120.0

[model_task_config.embedding]
model_list = []
max_tokens = 4096
temperature = 0.3
slow_threshold = 15.0
selection_strategy = "balance"
hard_timeout = 60.0

# =========================
# API Providers
# =========================

[[api_providers]]
name = "DeepSeek"
base_url = "https://api.deepseek.com"
api_key = "your-api-key"
client_type = "openai"
auth_type = "bearer"
auth_header_name = "Authorization"
auth_header_prefix = "Bearer"
auth_query_name = "api_key"
default_headers = {}
default_query = {}
model_list_endpoint = "/models"
reasoning_parse_mode = "auto"
tool_argument_parse_mode = "auto"
max_retry = 3
timeout = 100
retry_interval = 8

[[api_providers]]
name = "LocalOpenAI"
base_url = "http://192.168.0.112:11435/v1"
api_key = "local"
client_type = "openai"
auth_type = "bearer"
auth_header_name = "Authorization"
auth_header_prefix = "Bearer"
auth_query_name = "api_key"
default_headers = {}
default_query = {}
model_list_endpoint = "/models"
reasoning_parse_mode = "none"
tool_argument_parse_mode = "auto"
max_retry = 1
timeout = 60
retry_interval = 1

[[api_providers]]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
api_key = "YOUR_OPENROUTER_API_KEY"
client_type = "openai"
auth_type = "bearer"
auth_header_name = "Authorization"
auth_header_prefix = "Bearer"
auth_query_name = "api_key"
default_headers = { "HTTP-Referer" = "https://localhost", "X-Title" = "HimariBot" }
default_query = {}
model_list_endpoint = "/models"
reasoning_parse_mode = "none"
tool_argument_parse_mode = "auto"
max_retry = 2
timeout = 60
retry_interval = 3
